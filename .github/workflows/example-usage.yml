name: Build and Package Example V2

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
    branches: [ main ]


permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  detect-changes:
    if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 'Release') || contains(github.head_ref, '-test'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run NuGet Package Build and Release
        id: build_release
        uses: ./.github/actions/nuget-package-build-release
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          projects: |
            {
              "LibraryA": {
                "path": "LibraryA/LibraryA.csproj",
                "patterns": ["LibraryA/**"],
                "dependencies": ["LibraryB", "LibraryC"]
              },
              "LibraryB": {
                "path": "LibraryB/LibraryB.csproj",
                "patterns": ["LibraryB/**"],
                "dependencies": ["LibraryC"]
              },
              "LibraryC": {
                "path": "LibraryC/LibraryC.csproj",
                "patterns": ["LibraryC/**"],
                "dependencies": []
              },
              "LibraryD": {
                "path": "LibraryD/LibraryD.nuspec",
                "patterns": ["LibraryD/**"],
                "dependencies": []
              }
            }

      - name: Debug Output
        run: |
          echo "Changes: ${{ steps.build_release.outputs.changes }}"
          echo "Modified packages: ${{ steps.build_release.outputs.modified_packages }}"
          echo "Ordered changes: ${{ steps.build_release.outputs.ordered_changes }}"
          echo "Has nuspec: ${{ steps.build_release.outputs.has_nuspec }}"

      # - name: Further steps commented out for testing
      #   run: |
      #     echo "Further steps will be re-enabled after testing"