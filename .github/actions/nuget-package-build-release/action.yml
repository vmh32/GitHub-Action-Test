name: 'NuGet Package Build and Release'
description: 'Build and release NuGet packages'

inputs:
  github_token:
    description: 'GitHub token'
    required: true
  projects:
    description: 'JSON object containing project configurations'
    required: true

outputs:
  changes:
    description: 'List of changed files'
    value: ${{ steps.detect_changes.outputs.changes }}
  modified_packages:
    description: 'List of modified packages'
    value: ${{ steps.detect_changes.outputs.modified_packages }}
  ordered_changes:
    description: 'List of packages in order of build'
    value: ${{ steps.detect_changes.outputs.ordered_changes }}
  has_nuspec:
    description: 'Whether any of the modified packages use nuspec'
    value: ${{ steps.detect_changes.outputs.has_nuspec }}

runs:
  using: "composite"
  steps:
    - name: Debug Environment
      shell: bash
      run: |
        echo "Current directory: $(pwd)"
        echo "GitHub workspace: $GITHUB_WORKSPACE"
        echo "Action path: ${{ github.action_path }}"
        ls -la

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Filter Changes
      id: detect_changes
      shell: python
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        import os
        import json
        import sys
        sys.path.append(os.path.join(os.environ['GITHUB_ACTION_PATH'], 'src'))
        from detect_changes import detect_changes

        with open(os.environ['GITHUB_EVENT_PATH'], 'r') as f:
            event = json.load(f)

        projects = json.loads('''${{ inputs.projects }}''')
        
        changes, modified_packages, ordered_changes, has_nuspec = detect_changes(
            projects=projects,
            event=event
        )

        with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            print(f"changes={json.dumps(changes)}", file=f)
            print(f"modified_packages={json.dumps(modified_packages)}", file=f)
            print(f"ordered_changes={json.dumps(ordered_changes)}", file=f)
            print(f"has_nuspec={json.dumps(has_nuspec)}", file=f)

